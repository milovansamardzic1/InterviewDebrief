services:
  postgres:
    image: postgres:16-alpine
    container_name: interwjuer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interwjuer
    ports:
      - "5432:5432"
    volumes:
      - interwjuer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interwjuer_postgres_data:
